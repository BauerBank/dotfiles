# Wayland session environment (read by systemd environment.d)
# These reach sway and all apps it launches when sway is started under a
# systemd user session (e.g. greetd). For portals/dbuses, the sway config also
# pushes XDG_CURRENT_DESKTOP via dbus-update-activation-environment.
GDK_BACKEND=wayland
QT_QPA_PLATFORM=wayland
MOZ_ENABLE_WAYLAND=1
XDG_CURRENT_DESKTOP=sway
XDG_SESSION_DESKTOP=sway
XDG_SESSION_TYPE=wayland
_JAVA_AWT_WM_NONREPARENTING=1
